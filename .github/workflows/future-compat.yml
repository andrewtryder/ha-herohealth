name: Future Home Assistant compatibility
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip
          pip install "pytest-homeassistant-custom-component>=0.13,<0.14" pytest pytest-asyncio pytest-cov ruff
          python -c "from homeassistant.const import __version__; from importlib.metadata import version; print('Future lane: HA={}, pytest-homeassistant-custom-component={}'.format(__version__, version('pytest-homeassistant-custom-component')))"
          ruff check .
          pytest
