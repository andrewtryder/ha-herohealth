name: Future Home Assistant compatibility
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: |
          uv venv --python 3.14 .venv-compat
          uv pip install --python .venv-compat/bin/python "pytest-homeassistant-custom-component>=0.13,<0.14" pytest pytest-asyncio pytest-cov pytest-socket ruff
          .venv-compat/bin/python -c "from homeassistant.const import __version__; from importlib.metadata import version; print('Future lane: HA={}, pytest-homeassistant-custom-component={}'.format(__version__, version('pytest-homeassistant-custom-component')))"
          .venv-compat/bin/ruff check .
          .venv-compat/bin/pytest --disable-socket --allow-unix-socket
