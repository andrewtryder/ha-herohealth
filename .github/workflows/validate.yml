name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: requirements_test.lock
      - run: |
          uv venv --python 3.14 .venv
          uv pip sync --python .venv/bin/python requirements_test.lock
      - run: |
          .venv/bin/python --version
          .venv/bin/python -c "from homeassistant.const import __version__; assert __version__ == '2026.8.3'; print(__version__)"
          .venv/bin/python -c "from importlib.metadata import version; print(version('pytest-homeassistant-custom-component'))"
          .venv/bin/pre-commit run --all-files
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/pytest --disable-socket --allow-unix-socket
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.1
        if: always()
        with:
          name: coverage-baseline
          path: coverage.xml
