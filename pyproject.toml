[project]
name = "ha-herohealth"
version = "0.0.0"
description = "Hero Health smart pill dispenser integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-homeassistant-custom-component==0.13.357",
    "pytest-socket==0.8.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=custom_components.hero_health --cov-report=term-missing --cov-report=xml --cov-fail-under=95 -m 'not live'"
markers = [
    "live: opt-in tests that contact the real Hero service",
]
