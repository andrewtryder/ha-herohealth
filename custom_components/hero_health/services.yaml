refresh:
  name: Refresh Hero data
  description: Immediately refreshes one Hero Health connection.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: hero_health
dispense_scheduled_dose:
  name: Dispense scheduled dose
  description: Safety-sensitive action. Dispenses only a currently eligible Hero scheduled dose after Hero preflight and completion confirmation.
  fields:
    scheduled_datetime:
      required: false
      selector:
        text:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: hero_health
